<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Cashback Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <h1>Credit Card Cashback Tracker</h1>

    <div class="input-container">
        <input type="number" id="inputAmount" placeholder="Enter Amount" />
        <button onclick="calculateCashback()">Calculate Cashback</button>
    </div>

    <table id="cashbackTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Card Name</th>
                <th onclick="sortTable(1)">Category</th>
                <th onclick="sortTable(2)">Rounded Amount (₹)</th>
                <th onclick="sortTable(3)">Divided Value</th>
                <th onclick="sortTable(4)">CBR (₹)</th>
                <th onclick="sortTable(5)">Rewards Name</th>
                <th onclick="sortTable(6)">Rewards Calculator (₹)</th>
                <th onclick="sortTable(7)">Cashback (₹)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data populated dynamically -->
        </tbody>
    </table>

    <button id="settingsButton" onclick="openPopup()">
        <i class="fas fa-cog"></i>
    </button>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2>Customize Colors</h2>
            <label for="bgColor">Background Color:</label>
            <input type="color" id="bgColor" value="#f0f4f8">
            <label for="textColor">Text Color:</label>
            <input type="color" id="textColor" value="#333">
            <label for="headerBgColor">Table Header Background Color:</label>
            <input type="color" id="headerBgColor" value="#34495e">
            <label for="headerTextColor">Table Header Text Color:</label>
            <input type="color" id="headerTextColor" value="#ffffff">
            <label for="buttonBgColor">Button Background Color:</label>
            <input type="color" id="buttonBgColor" value="#3498db">
            <label for="buttonTextColor">Button Text Color:</label>
            <input type="color" id="buttonTextColor" value="#ffffff">
            <button onclick="applySettings()">Apply Settings</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
